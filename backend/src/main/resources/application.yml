# ---------- Shared settings (all profiles) ----------
spring:
  application:
    name: fraudguard
  lifecycle:
    timeout-per-shutdown-phase: 20s   # how long graceful shutdown may wait (HTTP, then the Kafka listener)
  profiles:
    default: local            # used when no profile is chosen explicitly
  jpa:
    open-in-view: false       # don't hold DB sessions open while rendering responses
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only CHECKS it matches
  data:
    redis:
      timeout: 2s             # per Redis command. The default is 60 s, which would stall the Kafka consumer for
      connect-timeout: 2s     # minutes during a Redis outage instead of failing fast into the retry/DLQ path
  kafka:
    producer:
      acks: all               # wait until the broker has safely stored the message
      properties:
        enable.idempotence: true   # the producer never writes the same message twice on retry
        max.block.ms: 5000         # if Kafka is down, fail after 5s instead of hanging the API for 60s
    consumer:
      group-id: fraudguard-transaction-processor   # consumers in one group share the work
      auto-offset-reset: earliest                  # a brand-new group starts from the oldest message

server:
  port: 8080
  shutdown: graceful          # on stop: finish in-flight requests before exiting

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics   # /actuator/prometheus is what Prometheus scrapes
  endpoint:
    health:
      probes:
        enabled: true                 # adds /actuator/health/liveness and /actuator/health/readiness
      show-details: when_authorized   # the status is public; database and Redis details need the METRICS login
      roles: METRICS
      group:
        readiness:
          include: readinessState,db,redis   # "ready" = can reach PostgreSQL and Redis (ML is optional: rules still decide)
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true    # histogram buckets, so Grafana can show p95 latency per URI
    tags:
      application: fraudguard         # added to every metric, so dashboards can filter by service

fraudguard:
  # Login, roles and keys. Every secret comes from an environment variable (see .env.example): none is committed.
  security:
    token-ttl-minutes: 60
    jwt-secret: ${FRAUDGUARD_JWT_SECRET:}              # at least 32 bytes; blank only works on the local profile
    ingest-api-keys: ${FRAUDGUARD_INGEST_API_KEYS:}    # comma-separated keys accepted on POST /api/transactions
    metrics-username: ${FRAUDGUARD_METRICS_USERNAME:prometheus}
    metrics-password: ${FRAUDGUARD_METRICS_PASSWORD:}  # Prometheus logs in with this
    login-attempts-per-minute: 5
    # First users, created only when the users table is empty
    admin-username: ${FRAUDGUARD_ADMIN_USERNAME:}
    admin-password: ${FRAUDGUARD_ADMIN_PASSWORD:}
    analyst-username: ${FRAUDGUARD_ANALYST_USERNAME:}
    analyst-password: ${FRAUDGUARD_ANALYST_PASSWORD:}
    seed-username: ${FRAUDGUARD_SEED_USERNAME:}        # the demo labeller (an ANALYST)
    seed-password: ${FRAUDGUARD_SEED_PASSWORD:}

  reliability:
    stuck-after-seconds: 120    # a transaction PENDING longer than this counts as "stuck" (gauge + re-drive)

  # Which web pages (origins) may call the API from a browser. Comma-separated.
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173   # the React dev server

  # ML scoring service (Python). Scoring is optional: if the service is down, rules still decide.
  ml:
    enabled: true
    base-url: http://localhost:8000
    timeout-ms: 1500          # give up on a call after this long
    failure-threshold: 3      # this many failures in a row open the circuit breaker
    open-seconds: 30          # ...and ML calls are skipped for this long
    service-token: ${SERVICE_TOKEN:}   # sent as X-Service-Token on /score (secret: from the environment)
    admin-token: ${ADMIN_TOKEN:}       # sent as X-Admin-Token on /admin/registry

  # The final decision policy: combines rule verdict + ML score + velocity features.
  # Change a number here and restart. Bump policy-version when you change the policy, so every
  # stored decision says which policy made it. See docs/decision-policy.md.
  decision:
    policy-version: policy-v1
    ml-min-history: 5         # the ML score only counts for accounts with at least this many earlier transactions
    ml-review-at: 0.66        # ML anomaly score at/above this = "elevated": a clean transaction goes to REVIEW
    ml-very-high-at: 0.70     # at/above this = "very high": with a rule REVIEW it becomes BLOCKED

  # Fraud rules: change a number here and restart, no code change needed.
  rules:
    high-velocity:
      enabled: true
      max-per-five-minutes: 5     # more than this many transactions in 5 minutes fires the rule
      max-per-hour: 20            # ...or more than this many in an hour
      score: 40
    unusual-amount:
      enabled: true
      min-z-score: 3.0            # standard deviations above the account's usual amount
      min-amount: 1000            # ignore small amounts, however unusual
      score: 50
    new-device-high-amount:
      enabled: true
      min-history: 5              # needs this many earlier transactions to judge "high"
      amount-multiplier: 3.0      # "high" = at least this many times the account's average
      score: 30
    rapid-country-change:
      enabled: true
      within-seconds: 3600        # country changed within this long after the previous transaction
      score: 35
    decision:                     # the RULE ENGINE's own score bands (the final policy is fraudguard.decision)
      review-at: 40               # rule score at or above this -> the rules say REVIEW
      block-at: 80                # rule score at or above this -> the rules say BLOCKED

---
# ---------- local profile: app on your machine, services in docker compose ----------
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # ${NAME:default} = use environment variable NAME, or the default if it isn't set
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:fraud}
    username: ${POSTGRES_USER:fraud_user}
    password: ${POSTGRES_PASSWORD:change_me_locally}
  kafka:
    bootstrap-servers: localhost:${KAFKA_HOST_PORT:29092}   # the host-facing Kafka listener
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}

---
# ---------- test profile: Testcontainers supplies the database, Kafka and Redis ----------
spring:
  config:
    activate:
      on-profile: test
fraudguard:
  ml:
    enabled: false            # tests don't call the ML service unless a test switches it on
logging:
  level:
    com.fraudguard: DEBUG