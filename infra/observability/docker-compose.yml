# Prometheus (collects metrics) + Grafana (draws them). Separate from the main docker-compose.yml so
# the core stack stays small.   Start:  docker compose -f infra/observability/docker-compose.yml up -d
name: fraudguard-observability

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "127.0.0.1:9090:9090"            # reachable from this machine only
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets:/etc/prometheus/secrets:ro      # metrics_password, from scripts/setup-local-env.sh
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach the app running on your machine
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}   # local demo default: change it if you share the machine
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro   # dashboards as code
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
