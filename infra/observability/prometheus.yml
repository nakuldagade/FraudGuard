global:
  scrape_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml     # alert rules; no Alertmanager, alerts show at :9090/alerts

scrape_configs:
  - job_name: fraudguard-backend
    metrics_path: /actuator/prometheus
    basic_auth:                       # /actuator/** needs the METRICS login (see docs/observability.md)
      username: prometheus
      password_file: /etc/prometheus/secrets/metrics_password
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # The ML service. It must listen on 0.0.0.0 (not 127.0.0.1) so the container can reach it:
  #   python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
  # Safe now: /admin/* and /score need tokens; only /health and /metrics are open.
  - job_name: fraudguard-ml
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
