name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"      # Mondays: new advisories appear even when the code does not change

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write     # to upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (ML service)
        run: |
          pip install pip-audit
          pip-audit -r ml-service/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (frontend, fails on HIGH or above)
        working-directory: frontend
        run: npm audit --audit-level=high

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, ml-service, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.image }}
        run: docker build -t fraudguard-${{ matrix.image }}:scan ./${{ matrix.image }}
      - name: Trivy scan (fails on HIGH or CRITICAL that have a fix)
        # Pinned to the exact commit of v0.36.0 (not a movable tag): this action had a supply-chain attack in March 2026,
        # after which its old tags were removed and re-created with a "v" prefix.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fraudguard-${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-${{ matrix.image }}.txt
      # The scan step above writes its report to a file, so print it here, and also publish the findings as an
      # annotation (visible on the run page and through the API, unlike log text which needs a login).
      - name: Show Trivy findings
        if: always()
        run: |
          f="trivy-${{ matrix.image }}.txt"
          if [ -f "$f" ]; then
            cat "$f"
            rows=$(grep -E "CVE-|GHSA-" "$f" | sed -E 's/[│├┤┬┴┼─┌┐└┘ ]+/ /g' | head -40 | tr '\n' ';')
            [ -n "$rows" ] && echo "::error title=Trivy findings (${{ matrix.image }})::${rows}"
          fi
          exit 0

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0         # scan the whole history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
