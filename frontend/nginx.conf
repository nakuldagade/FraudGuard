server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The API: same origin as the page, so the browser needs no CORS
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host keeps the port. With $host the backend sees "localhost" while the browser's Origin header says
        # "localhost:8081", and Spring rejects the POST as a cross-origin request (403).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    # Built files have hashed names, so they can be cached for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
